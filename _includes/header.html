<header class="site-header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      <span class="prompt">$</span> joapath<span class="cursor">_</span>
    </a>
    <nav>
      <button class="nav-toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
        <li><a href="{{ '/about' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a></li>
        <li><a href="{{ '/research' | relative_url }}" {% if page.url contains '/research' %}class="active"{% endif %}>Research</a></li>
        <li><a href="{{ '/tools' | relative_url }}" {% if page.url contains '/tools' %}class="active"{% endif %}>Tools</a></li>
        <li><a href="{{ '/blog' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a></li>
      </ul>
    </nav>
  </div>
</header>
<script>
document.querySelector('.nav-toggle').addEventListener('click', function() {
  document.querySelector('.nav-links').classList.toggle('open');
});
</script>
